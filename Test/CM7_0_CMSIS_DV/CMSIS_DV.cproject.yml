project:
  description: CMSIS Driver Validation application for Ethernet driver running on Cortex-M7 core 0

  # List of packs used in the project.
  packs:
    - pack: ARM::CMSIS@6.4.0
    - pack: ARM::CMSIS-Compiler@^2.1.0
    - pack: ARM::CMSIS-Driver_Validation@^3.1.0
    - pack: ARM::CMSIS-RTX@^5.9.0

  # List of connections required or provided by the project.
  connections:
    - connect: Driver Validation
      provides:
        - CMSIS-RTOS2
      consumes:
        - STDOUT

  # List of source groups and files.
  groups:
    - group: Documentation
      files:
        - file: README.md
    - group: Source Files
      files:
        - file: app_main.c

  # List of components used by the application.
  components:
    - component: CMSIS:OS Tick:SysTick
    - component: CMSIS:RTOS2:Keil RTX5&Source
    - component: CMSIS Driver Validation:Framework
    - component: CMSIS Driver Validation:Ethernet

  # List of layers.
  layers:
    - layer: $SolutionDir()$/../Board/KIT_T2G-B-H_LITE/Cortex-M7-0/Board.clayer.yml
      type: Board

  # List of executable file formats to be generated.
  output:
    type:
      - elf
      - hex
      - map
